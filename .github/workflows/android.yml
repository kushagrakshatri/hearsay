name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scenes:
        description: 'Demo scenes to film, as a JSON list'
        default: '["chat","mail","names","plane"]'

permissions:
  contents: write   # publish each main build as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK and CMake (SDK is preinstalled on ubuntu-latest)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hearsay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Build signed release APK + AAB (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HEARSAY_SIGNING_PASSWORD: ${{ secrets.HEARSAY_SIGNING_PASSWORD }}
        run: |
          if [ -z "$HEARSAY_SIGNING_PASSWORD" ]; then echo "No signing secret; skipping release build"; exit 0; fi
          export HEARSAY_KEYSTORE="$RUNNER_TEMP/hearsay-release.p12"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/signing/hearsay-release.p12.enc \
            -out "$HEARSAY_KEYSTORE" -pass env:HEARSAY_SIGNING_PASSWORD
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
          rm -f "$HEARSAY_KEYSTORE"
          cp app/build/outputs/apk/release/app-release.apk hearsay.apk
          cp app/build/outputs/bundle/release/app-release.aab hearsay.aab
          ls -l hearsay.apk hearsay.aab
      - name: Publish release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hearsay-debug.apk
          gh release create "build-${{ github.run_number }}" hearsay-debug.apk $(ls hearsay.apk hearsay.aab 2>/dev/null) \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Hearsay build ${{ github.run_number }}" \
            --latest \
            --notes "Build of ${{ github.sha }}. hearsay.apk is the signed release for phones; hearsay-debug.apk is the debug build (installs beside it as Hearsay Debug); hearsay.aab is for Google Play. Always-newest link: https://github.com/${{ github.repository }}/releases/latest/download/hearsay.apk"

  # Screenshot tour on an emulator: every setup step, settings, keyboard states, light and dark.
  screens:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hearsay-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash tools/ui/tour.sh apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hearsay-screens
          path: shots/
      - name: Push screenshots to the ui-screens branch (main only)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd shots && git init -q -b ui-screens && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screens for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-screens

  demo:
    # Launch-video footage. Runs on demand, or when a main commit message contains [demo].
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[demo]')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(inputs.scenes || '["chat","mail","names","plane"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hearsay-debug-apk
          path: apk
      - name: Fetch models (pinned)
        run: |
          mkdir -p models && cd models
          P=https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/resolve/main
          for f in encoder.int8.onnx decoder.int8.onnx joiner.int8.onnx tokens.txt; do curl -fsSL -o $f $P/$f; done
          curl -fsSL -o Qwen3.5-2B-Q4_K_M.gguf https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf
          ls -l
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 6144M
          cores: 4
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash tools/demo/record.sh apk/app-debug.apk ${{ matrix.scene }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hearsay-demo-footage-${{ matrix.scene }}
          path: footage/
