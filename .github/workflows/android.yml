name: Android build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # publish each main build as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK and CMake (SDK is preinstalled on ubuntu-latest)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hearsay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hearsay-debug.apk
          gh release create "build-${{ github.run_number }}" hearsay-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Hearsay build ${{ github.run_number }}" \
            --latest \
            --notes "Debug build of ${{ github.sha }}. Download hearsay-debug.apk below and install it on your phone. Always-newest link: https://github.com/${{ github.repository }}/releases/latest/download/hearsay-debug.apk"
